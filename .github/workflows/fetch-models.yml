name: Sync Model Library

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - test
          - production
        default: 'test'
      dry_run:
        description: 'Dry run (show changes without pushing to Webflow)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync models to Webflow
        run: node scripts/fetch-models.js
        env:
          MODULAR_CLOUD_API_TOKEN: ${{ secrets.MODULAR_CLOUD_API_TOKEN }}
          MODULAR_CLOUD_ORG: ${{ vars.MODULAR_CLOUD_ORG }}
          MODULAR_CLOUD_BASE_URL: ${{ vars.MODULAR_CLOUD_BASE_URL }}
          WEBFLOW_API_TOKEN: ${{ inputs.environment == 'production' && secrets.PROD_WEBFLOW_API_TOKEN || secrets.TEST_WEBFLOW_API_TOKEN }}
          WEBFLOW_SITE_ID: ${{ inputs.environment == 'production' && vars.PROD_WEBFLOW_SITE_ID || vars.TEST_WEBFLOW_SITE_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
